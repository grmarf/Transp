name: Apply scripted bug fixes
on:
  push:
    branches: [fix/bug-sweep-v1]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes and commit
        run: |
          set -e
          echo '' | base64 -d > /tmp/fix.py
          python3 /tmp/fix.py
          rm .github/workflows/apply-bugfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing to change"; exit 0; fi
          git commit -m "fix: correctifs de bugs silencieux (travaux perdus au chargement, contrats, correspondances, dette, teleportations)"
          git push origin HEAD:fix/bug-sweep-v1
