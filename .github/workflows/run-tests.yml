#!/usr/bin/env node
# Exécute les tests JavaScript dans le dossier 'tests'
name: Run Tests
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install --production
        working-directory: ./tests
      
      - name: Run all tests
        run: node ./tests/run-all.mjs